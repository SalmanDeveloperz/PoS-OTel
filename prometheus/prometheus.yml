global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel_collector_internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel_spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: pipeline_simulator
    static_configs:
      - targets: ["pipeline-simulator:8000"]

  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ["jenkins:8080"]
